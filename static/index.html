<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вектор — чат-бот</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%232f5bea%27/%3E%3Cpath d=%27M8 9l8 15 8-15%27 stroke=%27white%27 stroke-width=%273.5%27 fill=%27none%27/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="chat">
    <header class="chat__header">
      <span class="chat__title">Вектор</span>
      <span class="chat__subtitle">Чат-бот рекламного агентства</span>
    </header>
    <section id="messages" class="messages" aria-live="polite"></section>
    <nav id="buttons" class="buttons" aria-label="Действия"></nav>
    <form id="form" class="composer" autocomplete="off">
      <input id="input" type="text" maxlength="2000" placeholder="Напишите сообщение…" aria-label="Сообщение">
      <button type="submit" id="send">Отправить</button>
    </form>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
